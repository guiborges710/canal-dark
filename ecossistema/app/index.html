<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<base href="/financas/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecossistema do Guilherme</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="financas.css">
<link rel="stylesheet" href="clipes.css">
</head>
<body>
<a class="pular" href="#principal">Pular para o conteúdo</a>
<div id="app"></div>
<div id="toast" class="toasts" role="status" aria-live="polite"></div>
<!-- dados_demo.js: só o catálogo de nomes que base.js exige (agentes, menu). Nenhum dado financeiro. -->
<script src="dados_demo.js"></script>
<script src="base.js"></script>
<script src="comum_gh.js"></script>
<!-- Router: determina qual tela renderizar baseado no #hash -->
<script>
(function () {
  function rota() {
    var r = (location.hash.replace(/^#\/?/, "").split("/")[0]) || "financas";
    return r;
  }
  var r = rota();
  window.addEventListener("hashchange", function () {
    if ((rota() === "clipes") !== (r === "clipes")) location.reload();
  });
  if (r === "clipes") {
    document.body.classList.remove("fin");
    var script = document.createElement("script");
    script.src = "clipes.js";
    document.body.appendChild(script);
  } else {
    document.body.classList.add("fin");
    var script = document.createElement("script");
    script.src = "financas.js";
    document.body.appendChild(script);
  }
})();
</script>
</body>
</html>
