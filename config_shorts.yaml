# Perfil do canal (Shorts 9:16, animação vetorial por código). Perfil padrão. O vídeo horizontal sobrepõe só o bloco
# `render` em config_horizontal.yaml (python run.py video --formato horizontal).
channel:
  niche: "Análise de Comportamento Social e Gerações"   # nicho do canal (definido em 2026-10-07)
  audience: "brasileiros 18-45 interessados em entender comportamento, gerações e sociedade com nuance"
  language: pt-BR        # idioma dos textos dos cartões e da descrição
  minutes: 0.75          # alvo de duração do texto (~150 palavras/min): Short de 30 a 60 s; o vídeo real vem do cenas.json

# Limites e política de custo. A pipeline inteira roda sem custo: render local, efeitos por código.
budget:
  max_usd_per_video: 0        # 0 = nada pago; o único gasto possível é o texto pela API (--allow-paid)
  max_retries_per_step: 2

# Entrega e publicação.
publish:
  destination: "output/<slug>/"   # onde ficam video.mp4, thumbnail.jpg, PUBLICAR.txt e CONFORMIDADE.md
  # Upload automático via OAuth (python run.py publish). Padrão: sobe como PRIVADO e você publica no Studio.
  # Só roda depois do Vini aprovar (auditoria.md com APROVADO).
  privacy: private                # private (padrão) | unlisted | public
  category_id: 22                 # 22 = People & Blogs; 27 = Education
  client_secret_file: client_secret.json   # credencial OAuth (gitignored)
  token_file: .youtube_token.json          # token gerado no 1º consentimento (gitignored)

# Qual modelo faz cada agente de texto (só usado no fallback --allow-paid)
tiers:
  research: fast
  writer: smart
  reviewer: fast
  metadata: fast
  ideas: fast
  angle: smart

models:
  fast: claude-haiku-4-5-20251001
  smart: claude-opus-4-8

research:
  youtube_queries: []    # ex.: ["curiosidades históricas", "mistérios da história"]
  region: BR
  days_back: 180
  max_results: 25

# Narração (opcional): cada cena com o campo "fala" é narrada com o Chatterbox (MIT, roda em CPU).
# amostra = áudio da SUA voz para clonar (10 s a 2 min, em português, sem ruído). Vazio = voz padrão do modelo.
voz:
  amostra: "voz/amostra.wav"
  threads: 8
  # Ritmo da narração (mais dinâmico = mais retenção). Mexa aqui, não no código.
  velocidade: 1.15       # 1.0 = como o modelo falou; 1.1 a 1.25 = ritmo de Short; acelera sem mudar o tom
  pausa_frase_s: 0.10    # pausa entre frases dentro de uma fala
  pausa_max_s: 0.18      # pausas internas (vírgulas, etc.) maiores que isso são encurtadas para este valor
  exaggeration: 0.6      # expressividade da voz (padrão do modelo 0.5; mais alto = mais energia)
  cfg_weight: 0.4        # peso da amostra (padrão do modelo 0.5; mais baixo = ritmo mais solto)
  inicio_s: 0.05         # silêncio antes da voz no começo de cada cena
  respiro_s: 0.12        # respiro depois da fala, até a próxima cena

# Vídeo: animação vetorial (render/) com efeitos sonoros por código. Sem imagens.
render:
  formato: vertical          # vertical (Short) | horizontal (ver config_horizontal.yaml)
  width: 1080
  height: 1920
  fps: 30
  duracao_min_s: 20
  duracao_max_s: 60

compliance:
  max_videos_per_day: 2      # acima disso o verificador avisa (publicação em volume parece produção em massa)
  max_title_chars: 70

# Preço por milhão de tokens da API (só entra no custo quando o texto é gerado pela API, --allow-paid).
prices:
  llm_per_mtok:
    claude-haiku-4-5-20251001: {in: 1.0, out: 5.0}
    claude-sonnet-5-5: {in: 3.0, out: 15.0}   # confirmar preço do modelo atual

# Cronograma de postagem (PROG-011): só SUGERE data e hora para publicar no Studio; não agenda nem publica.
# Sem esta seção vale 1 vídeo por dia às 18:00. Descomente e ajuste quando a cadência for decidida.
# cronograma:
#   dias: [seg, qua, sex]   # ou "todos"
#   hora: "18:00"
