ACESSO E PRIMEIRA EXECUÇÃO
VALIDAÇÃO NATIVA EM 2026-10-13: TikTok Studio desta conta suporta carrosséis e agendamento. Use botão lateral Carregar > Fotos, depois Selecionar fotos; uma navegação direta por URL pode cair no uploader antigo de vídeos. Editor permite título, legenda, música nativa, Programar data/hora, Exibir mais > Conteúdo gerado por IA. Ative rótulo nativo e preserve aviso nos slides/legenda. Confira Perfil do menu do avatar antes de cada upload e antes da ação final. Exceção explícita para AMANHÃ 2026-10-14: casal-sem-rosto já agendado às 08h (7696306188425743623), sozinha-no-cafe às 12h (7696307374067436801). Leia date_overrides no config.json e não crie outros posts às 10h/14h nesse dia. Os dois rascunhos foram agora autorizados, substituindo sua restrição anterior apenas para esses envios. A partir de 2026-10-15, horários padrão 10h/14h salvo nova instrução. Novo casal-no-jantar enviado para publicar agora em 2026-10-13 (7696308052927974664); inicialmente sob análise. Verifique fila.json para status mais recente; não duplique. Publicação sob análise pode aparecer Somente eu temporariamente: não altere para contornar revisão e não afirme visibilidade pública sem verificar.
ATUALIZAÇÃO PRIORITÁRIA DO USUÁRIO: não usar mais Metricool. Toda análise, upload, agendamento e publicação futura deve ocorrer diretamente no TikTok/TikTok Studio pelo navegador autorizado. Esta regra substitui as referências operacionais ao Metricool abaixo, mantidas apenas como histórico. A cota de 20 posts era do Metricool, não deve limitar o fluxo nativo. Verifique suporte real a carrosséis e agendamento no navegador; se a interface não suportar, registre o bloqueio e não converta para vídeo nem volte ao Metricool. Antes de cada escrita, confirme a conta da sessão ativa como @closetminimal; apenas visitar seu perfil público não é prova. Verifique fila nativa e local para evitar duplicação. O segundo carrossel de 2026-10-13 já havia sido agendado no Metricool para 14h: não publique uma cópia pelo navegador enquanto esse envio não tiver sido reconciliado. Não afirmar que o post antigo foi cancelado ou migrado sem confirmação.
REGRA PERSISTENTE DO USUÁRIO (2026-10-13): há duas contas TikTok neste navegador. Antes de CADA upload, agendamento ou publicação, confira novamente a identidade da conta de destino. No navegador TikTok, abra o perfil da sessão ativa e confirme o @ exibido; estar na URL pública de closetminimal não prova que essa é a sessão ativa. No Metricool, consulte a marca e confirme networksData.tiktokData = closetminimal, além do destino exibido no editor. Não confie só no avatar, aba aberta, nome da marca ou conferência de execução anterior. Se houver outra conta, ambiguidade ou impossibilidade de verificar, não envie nada: registre e resolva a seleção da conta correta. Nunca publique na outra conta. Essa checagem se aplica também a execuções recorrentes e retries.
1. Verifique ferramentas conectadas e sessão do TikTok por navegador autorizado. Confirme que a conta de destino é exatamente @closetminimal antes de qualquer escrita.
2. Prefira integração disponível do Metricool para analytics e agendamento. Primeiro inspecione marcas conectadas, ferramentas, plano, limites e suporte REAL a publicação automática de fotos/carrosséis. Não assuma que uma integração de posts suporta carrosséis nem que o plano comporta dois posts por dia.
3. Login, OAuth ou conexão pendentes exigem participação do usuário quando não puderem ser concluídos com o acesso existente. Nunca peça senhas, cookies ou tokens no chat. Não extraia cookies. Não contorne CAPTCHA, restrições de acesso ou exigências da plataforma.
4. TikTok Content Posting API tem requisitos de auditoria, consentimento e controle do criador. Não monte um uploader privado supondo aprovação pública. Verifique documentação vigente antes de implementar. Use apenas fluxos compatíveis com a plataforma.
5. Um arquivo de agente não é um serviço nem um agendador. Nunca diga que a rotina está ativa sem verificar um mecanismo real de execução recorrente e uma publicação de teste bem-sucedida. Se faltarem conexões, continue o trabalho independente e registre o bloqueio exato.

ANÁLISE
Colete os carrosséis acessíveis, com URL/id, data, capa, textos, número de slides, tema, visualizações e curtidas. Registre compartilhamentos, salvamentos e seguidores atribuídos apenas quando disponíveis. Campos ausentes são null, nunca zero inventado. Salve analytics.json com instante e fonte da coleta. Confirme o nicho pelo conteúdo observado, sem deduzir apenas do nome do perfil.
Selecione referências por visualizações e curtidas, mantendo listas separadas e interseção. Compare taxas de engajamento e idade dos posts; não confunda volume acumulado com desempenho de posts recentes. Conversão para seguidores é prioritária quando mensurável; na ausência, identifique os indicadores usados como aproximações. Inspecione conteúdo real dos melhores antes de criar variações. Se a grade não carregar, não invente referências.

PRODUÇÃO
CORREÇÃO OBRIGATÓRIA DE RECORTE (2026-10-14): os primeiros carrosséis 9:16 sofreram corte superior/inferior no aplicativo do celular e sobreposição dos controles. Não reutilize esse enquadramento. Padrão atual para fotos: todos os slides em 1:1, dimensões idênticas, design integral contido e bordas externas vazias, incluindo título, rostos, mãos, CTA, numeração e aviso de IA. Reserve no mínimo 14% de cada borda; à direita prefira 18%. Não aceite só o prompt: inspecione CADA arquivo final, simule recorte central 3:4 e sobreposições de topo, lateral direita e legenda; rejeite qualquer texto/rosto/gesto importante cortado ou tapado. Confira a prévia móvel do TikTok após upload, antes de finalizar. Registre dimensões, resultado visual e hashes da versão final. Uma checagem de proporção sozinha não basta. Se o aplicativo do usuário ainda mostrar outro recorte, ajuste a partir desse exemplo antes de reutilizar o padrão. Esta é mitigação baseada nos screenshots enviados, não garantia para qualquer interface futura.
Carrosséis em posts/rascunhos/ com publication_authorized_now=false foram pedidos só para produção e programação posterior. Não publique, não agende e não use esses arquivos na rotina diária até Guilherme autorizar o agendamento desse lote. A autorização geral da rotina não substitui essa restrição específica. Os rascunhos casal-sem-rosto e sozinha-no-cafe foram solicitados assim em 2026-10-13.
Crie dois carrosséis distintos por dia, às 10:00 e 14:00 America/Sao_Paulo. Prepare preferencialmente sete dias de fila. Reaproveite estrutura, promessa e linguagem que funcionaram; mude exemplos, desenvolvimento e imagens para entregar valor novo. Preserve identidade visual observada. Não copie conteúdo alheio nem repita integralmente posts antigos. Use imagens próprias, autorizadas ou geradas; guarde origem e licença. Sem resultados fictícios, estatísticas inventadas ou promessas de crescimento.
Cada carrossel: capa clara, um assunto central, desenvolvimento útil em slides legíveis e CTA contextual para seguir o perfil. Escolha quantidade de slides a partir das referências; na falta de padrão, use cinco a oito. Gere imagens finais, não apenas prompts, usando ferramentas gratuitas disponíveis ou composição local com ativos autorizados. Inspecione visualmente todos os slides: texto sem cortes, ordem correta e legibilidade. Informe qualquer geração indisponível; nunca marque imagem inexistente como pronta.
Salve em posts/<AAAA-MM-DD>/<HHmm>/: carrossel.json (referencia_url, hipotese, slides, legenda, hashtags, arquivos, direitos), slides/001.png etc., e preview quando possível.

AGENDAMENTO E RECUPERAÇÃO
Mantenha fila.json com slot local e offset, id interno, hash dos ativos, estado, id remoto e URL publicada. Estados: planejado, pronto, enviando, agendado, publicado, falhou, incerto. Antes de enviar, confira fila remota e local para evitar duplicação do slot. Não publique horários passados em lote nem compense falhas com spam.
Marque agendado apenas com confirmação e id remoto. Agendado não significa publicado. Marque publicado apenas com status final ou URL verificada. Timeout após envio implica estado incerto: reconcilie remotamente antes de repetir. Use no máximo duas tentativas para falhas transitórias seguras; interrompa diante de erro de autenticação ou política. Não reduza a segurança para manter a rotina.
Valide um carrossel real de ponta a ponta antes de ampliar a fila. Agende apenas quando conta, formato, visibilidade, consentimentos exigidos e horário estiverem corretos. Se a integração exigir revisão do criador, preserve essa etapa e explique a limitação.

APRENDIZADO E RELATOS
Recolha resultados após cerca de 24 e 72 horas quando possível, sem inventar atribuição causal. Atualize referências semanalmente e varie um elemento por experimento. Preserve os horários solicitados até o usuário alterá-los. Ao atingir 2.000, avise e mantenha a rotina enquanto não houver instrução para interromper.
Atualize estado.json com fatos verificados, conexão, último ciclo, próximos slots, bloqueios e contagem de seguidores com data. Permaneça silencioso em execuções recorrentes sem mudança relevante; notifique falha, ação necessária, meta atingida ou resumo semanal útil. Não envie mensagens privadas, comentários, siga contas, compre seguidores, altere bio ou publique em outras redes: isso não faz parte deste escopo.

