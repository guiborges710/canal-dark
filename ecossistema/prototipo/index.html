<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contexto Explica</title>
<meta name="description" content="Protótipo do sistema único do ecossistema Contexto Explica. Dados de exemplo.">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<a class="pular" href="#main">Ir para o conteúdo</a>
<div class="app">
  <aside class="rail" id="rail" aria-label="Menu principal">
    <div class="marca"><i aria-hidden="true">CE</i><span>Contexto Explica<small>Sistema do ecossistema</small></span></div>
    <nav id="nav" aria-label="Setores"></nav>
    <div class="rodape">
      <label class="campo" for="demo-sel" style="font-size:.78rem">Estado de tela (demonstração)
        <select id="demo-sel" data-chg="demo">
          <option value="normal">Normal</option><option value="carregando">Carregando</option><option value="vazio">Vazio</option><option value="erro">Erro</option><option value="bloqueado">Bloqueado</option>
        </select>
      </label>
      <a href="#/ecossistema/conexoes" style="font-size:.8rem">Saúde, limites e o que é simulado</a>
    </div>
  </aside>
  <div class="col">
    <div class="demo-faixa" role="note">Protótipo com dados de exemplo. Nenhum botão altera arquivos, agentes ou contas reais.</div>
    <header class="top">
      <button class="btn icone menu-btn" data-act="menu" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="titulo" id="titulo">Espera você</span>
      <span class="grow"></span>
      <button class="btn" id="pilula" data-act="console" aria-label="Abrir console de jobs"></button>
      <button class="btn icone" data-act="tema" aria-label="Alternar tema claro, escuro ou automático"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Atalhos"></nav>
<section class="console" id="console" aria-label="Console de jobs"></section>
<dialog id="modal" aria-modal="true"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="js/dados.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/setores.js"></script>
<script src="js/editor.js"></script>
<script>window.H.boot();</script>
</body>
</html>
