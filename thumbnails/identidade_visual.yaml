formato:
  largura: 1080
  altura: 1920
  proporcao: '9:16'
  orientacao: vertical
  arquivo: PNG
  idioma_textos: pt-BR
areas_seguras:
  topo_livre: cerca de 15% da altura (a interface do YouTube cobre)
  base_livre: cerca de 20% da altura
  elemento_principal: centro, grande e reconhecível
estilo:
  tipo: ilustração vetorial 2D educativa, moderna e original
  contornos: grafite, definidos e limpos
  sombras: discretas, sólidas
  fundo: com contraste; faixas ou formas geométricas leves, sem poluição
  personagens: simples, expressivos; sem rostos de pessoas reais
  referencias_principios:
  - 'The Infographics Show: objetos grandes, contraste forte, perguntas visuais'
  - 'Psych2Go: emoção clara, composições simples'
  - 'Simple History: cenas narrativas simplificadas'
  - 'History Matters: poucos elementos por cena'
  proibido_copiar: personagens, layouts distintivos, logotipos ou elementos protegidos
    desses canais
paleta:
  azul: '#2563EB'
  azul_claro: '#38BDF8'
  amarelo: '#FACC15'
  laranja: '#FB923C'
  branco: '#FFFFFF'
  grafite: '#1F2937'
  ajuste: pode variar quando o assunto exigir, mantendo uma assinatura visual reconhecível
tipografia:
  familia: 'sans-serif pesada (ex.: Arial Black, Montserrat Black)'
  texto_max_palavras: 5
  texto_min_palavras: 2
  contraste: 'alto: branco sobre azul/grafite, grafite sobre amarelo'
  regra: texto exato, com acentos; sem texto extra; sem parágrafos
regras_gerais:
- Um elemento visual dominante por thumbnail
- 'Fidelidade ao vídeo: sem personagens, fatos ou números que o vídeo não tenha'
- Metáforas visuais permitidas quando claramente ilustrativas
- Sem clickbait falso
- Sem marca d'água nem logotipo de terceiros
historico_decisoes:
- data: '2026-10-26'
  decisao: 'Identidade inicial adotada: vetorial 2D, paleta do canal, 9:16, texto
    de 2 a 5 palavras.'
  motivo: Alinha as thumbnails ao estilo dos vídeos já produzidos (animação vetorial
    com cartões grafite).
- data: '2026-10-26'
  decisao: 'Exceção: miniatura 16:9 (1280x720) para upload do YouTube, quando a vertical
    não aparece como miniatura de vídeo. A vertical 9:16 continua como padrão.'
  motivo: A API aceitou a miniatura vertical, mas o vídeo mostrou o frame gerado pelo
    YouTube em 16:9.
- data: '2026-10-29'
  decisao: 'Variante sketch (shorts em caderno pautado, ex. jovens-bebendo-menos): papel bege #F5F3EA com linhas e margem vermelha, traço grafite irregular, bonecos de palito, vermelho de marcador #B91C1C e âmbar #F2B13C. Texto principal de 2 a 5 palavras mais um carimbo de contexto de 1 a 2 palavras (ex.: EUA) quando o recorte geográfico fizer parte da promessa.'
  motivo: 'Manter o reconhecimento do canal entre vídeo e miniatura; o recorte EUA evita generalizar o dado.'
- data: '2026-10-29'
  decisao: 'Textos de capa do sketch revisados (jovens-bebendo-menos): teste A/B/C com MENOR DESDE 1939 (+54%, copo com X), A GEN Z NÃO ESTÁ SOZINHA e ATÉ OS TIOS BEBEM MENOS, todos com selo EUA. Regras: a capa completa o título e não repete; no máximo um número; sem parou/ninguém/todo mundo; 1939 é o início da série Gallup; sem emoji nem bandeira.'
  motivo: 'O dono achou fracos os textos anteriores (repetiam o título e não usavam o número). Base: thumb_cristiano.md e thumb_memphis.md.'
- data: '2026-10-31'
  decisao: 'Regras firmes do dono para TODAS as thumbs: (1) o texto diz o tema grande e inequivoco (ex.: PIRAMIDE em caixa alta, legivel de longe) e complementa o titulo sem repeti-lo; (2) sensacionalismo obrigatorio -- choque/curiosidade/urgencia com vermelho/amarelo/preto, dinheiro subindo, base perdendo, setas/alerta, emocao exagerada do boneco. Pode usar fundo escuro/dramatico (sair do caderno bege) quando ficar mais forte, mantendo o traco sketch e a coerencia com o video. Limites CLAUDE.md seguem: sem pessoa real, sem marca, sem acusar empresa legal, numeros so das notas e com hedge.'
  motivo: 'Thumb de esquema-de-piramide foi reprovada por ser morna e nao dizer o tema. Refeita com conceito de IMPACTO (piramide de palitos, dinheiro subindo em setas vermelhas, base em desespero, PIRAMIDE + VOCE E A BASE).'
